[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "genai-template"
version = "0.1.0"
description = "A starter project promoting system design for Generative AI applications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name="babaksoft", email="babak.eslamieh@gmail.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*"]

dependencies = [
    "alembic",
    "dvc[s3]",
    "fastapi[standard]",
    "fastembed",
    "httpx",
    "llama-index-core",
    "llama-index-embeddings-fastembed",
    "llama-index-llms-ollama",
    "llama-index-vector-stores-chroma",
    "pydantic",
    "python-dotenv",
    "SQLAlchemy",
    "streamlit",
]

[project.urls]
Homepage = "https://github.com/babaksoft/genai-template"
Issues = "https://github.com/babaksoft/genai-template/issues"

[project.optional-dependencies]
build = [
    "build",
    "hatchling",
]

dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
    "ruff",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
known_third_party = [
    "alembic",
    "sqlalchemy",
]

[tool.ruff]
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services",
]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/genai_template"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
