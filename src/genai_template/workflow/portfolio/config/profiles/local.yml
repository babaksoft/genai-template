# Balanced local profile for Stage 0 inspection and Stage 1 corpus generation.
version: 1

generation:
  profile: balanced
  structured_generation:
    provider: openai
    model: gpt-4.1-mini-2025-04-14
    inference:
      temperature: 0.1
    timeout_seconds: 180
  prompt_version: v1
  output_schema_version: v1
  project_context:
    overview:
      - README.md
      - pyproject.toml
    architecture:
      - src/genai_template/api/**/*.py
      - src/genai_template/components/splitters/**/*.py
      - src/genai_template/services/**/*.py
    testing_operations:
      - README.md
      - pyproject.toml
      - tests/api/**/*.py
      - tests/components/splitters/**/*.py
      - tests/services/**/*.py
  input_limits:
    max_files: 100
    max_bytes: 262144
  locations:
    cache: storage/portfolio-artifacts-openai
    publication: data/portfolio
  pricing:
    input_per_million_tokens: 0.40
    output_per_million_tokens: 1.60

projects:
  - slug: genai-template
    display_name: GenAI Template
    repository:
      type: local_git
      path: .
      ref: HEAD
    selection:
      include:
        - README.md
        - pyproject.toml
        - src/**/*.py
        - tests/**/*.py
      exclude:
        - "**/__pycache__/**"
      max_file_bytes: 262144
    summary_units:
      - id: api
        paths:
          - src/genai_template/api/**/*.py
          - tests/api/**/*.py
      - id: components-splitters
        paths:
          - src/genai_template/components/splitters/**/*.py
          - tests/components/splitters/**/*.py
      - id: rag-services
        paths:
          - src/genai_template/services/**/*.py
          - tests/services/**/*.py
