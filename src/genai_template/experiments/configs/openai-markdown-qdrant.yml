# Markdown + OpenAI + local Qdrant configuration.
splitter:
  type: markdown
  header_path_separator: /

embedder:
  type: openai
  model_name: text-embedding-3-small
  dimensions: 1536
  request_timeout: 180

vector_store:
  type: qdrant
  distance: cosine
  location: local
  # Relative filesystem paths are resolved from the repository root.
  path: storage/qdrant

retrieval:
  top_k: 5

llm:
  type: openai
  model_name: gpt-4o-mini
  request_timeout: 180
